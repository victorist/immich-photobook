server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Проксируем вызовы API прямо на Immich внутри локальной сети
    location /api/ {
        proxy_pass http://192.168.1.56:2283/api/;
        proxy_set_header Host 192.168.1.56:2283;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
